# يبني الموقع وينشره تلقائيًا عند كل تعديل على الفرع main
name: نشر الموقع

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # بطاقات المشاركة وصور البريد. إن تعثّرت لا تمنع نشر الموقع.
      - name: بطاقات المشاركة
        continue-on-error: true
        run: |
          python3 build.py --og
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/og.mjs

      - name: بناء الموقع
        run: python3 build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
